[package]
name = "jp-study"
version = "0.14.1"
description = "一駅 · Windows 桌面壳（Tauri 2）"
authors = ["jp-study"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "jp_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
# refresh token 存 Windows 凭据管理器（契约 v1.1.0 §12.2）
keyring = { version = "3.6.3", features = ["windows-native"] }
# 软件内更新、学习提醒、更新后重启（契约 v1.3.0 §16）
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
