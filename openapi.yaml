        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ListeningAttemptPage' } } } }
    post:
      tags: [listening]
      operationId: createListeningAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateListeningAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ListeningAttempt' } } } }

  # ───────────────────────── writing ─────────────────────────
  /writing/submit:
    post:
      tags: [writing]
      operationId: submitWriting
      description: 提交 AI 批改。AI 失败时条目保存为 status=failed 并返回 503，可用同 id 重新提交（新 clientOpId）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitWritingRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WritingEntry' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /writing/entries:
    get:
      tags: [writing]
      operationId: listWritingEntries
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/WritingKind' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WritingStatus' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WritingEntryPage' } } } }
  /writing/entries/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [writing]
      operationId: getWritingEntry
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WritingEntry' } } } }
    delete:
      tags: [writing]
      operationId: deleteWritingEntry
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }

  # ───────────────────────── reading ─────────────────────────
  /reading/materials:
    get:
      tags: [reading]
      operationId: listReadingMaterials
      parameters:
        - { name: level, in: query, schema: { $ref: '#/components/schemas/DifficultyLevel' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingMaterialPage' } } } }
  /reading/materials/{materialId}:
    get:
      tags: [reading]
      operationId: getReadingMaterial
      parameters: [{ name: materialId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingMaterial' } } } }
  /reading/attempts:
    get:
      tags: [reading]
      operationId: listReadingAttempts
      parameters:
        - { name: materialId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingAttemptPage' } } } }
    post:
      tags: [reading]
      operationId: createReadingAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReadingAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingAttempt' } } } }

  # ───────────────────────── pronunciation ─────────────────────────
  /pronunciation/pairs:
    get:
      tags: [pronunciation]
      operationId: listPronunciationPairs
      parameters:
