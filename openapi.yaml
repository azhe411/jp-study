        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PronunciationPairPage' } } } }
  /pronunciation/attempts:
    get:
      tags: [pronunciation]
      operationId: listPronunciationAttempts
      parameters:
        - { name: pairId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PronunciationAttemptPage' } } } }
    post:
      tags: [pronunciation]
      operationId: createPronunciationAttempt
      description: 服务端判定 correct（listen：chosen==target；speak：transcript 与目标读音比对）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePronunciationAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PronunciationAttempt' } } } }

  # ───────────────────────── expressions (keigo / idiom) ─────────────────────────
  /expressions/items:
    get:
