openapi: 3.1.0
info:
  title: 一駅 API
  version: 1.13.0
  description: |
    契约冻结版 v1.2.0（v1.1.0 新增原生 App 支持，见 CONTRACT.md §12；v1.2.0 新增只读同步实体 dayPlan 与 HealthResponse.minClientVersion；v1.3.0 新增学习计划、课程体系、视频课程、应用更新，见 CONTRACT.md §14–§16）。规则详见 CONTRACT.md；字段与 shared/types.ts 一一对应，枚举取自 shared/constants.ts。
    - 所有路径前缀 /api/v1
    - 鉴权：Authorization: Bearer <accessToken>；refresh token：web 走 httpOnly cookie `jp_rt`，原生 App（X-Client-Platform: android|desktop）走请求/响应体
    - 所有写操作请求体带 clientOpId（UUID v4）实现幂等
    - 列表一律游标分页：?cursor=&limit=，响应 { items, nextCursor }
    - 错误统一为 ErrorResponse
servers:
  - url: /api/v1
security:
  - bearer: []

tags:
  - { name: system }
  - { name: auth }
  - { name: settings }
  - { name: tasks }
  - { name: cards }
  - { name: ai }
  - { name: scenarios }
  - { name: mistakes }
  - { name: phrases }
  - { name: speaking }
  - { name: listening }
  - { name: writing }
  - { name: reading }
  - { name: pronunciation }
  - { name: expressions }
  - { name: kanji }
  - { name: vocabTest }
  - { name: courses }
  - { name: stats }
  - { name: data }
  - { name: sync }

paths:
  # ───────────────────────── system ─────────────────────────
  /health:
    get:
      tags: [system]
      security: []
      operationId: health
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }

  # ───────────────────────── auth ─────────────────────────
  /auth/register:
    post:
      tags: [auth]
      security: []
      operationId: register
      parameters: [{ $ref: '#/components/parameters/ClientPlatform' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201':
          description: 注册成功并登录；Set-Cookie 下发 refresh token
          headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      parameters: [{ $ref: '#/components/parameters/ClientPlatform' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200':
          description: OK
          headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refresh
      description: |
        web：读取 cookie jp_rt；原生 App：读取请求体 refreshToken（并在响应体返回新的 refreshToken）。
        每次都轮换（rotation）。已作废的 token 被复用 → 吊销该会话族全部 token 并返回 401 REFRESH_TOKEN_INVALID。
      parameters: [{ $ref: '#/components/parameters/ClientPlatform' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses:
        '200':
          description: OK
          headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      security: []
      operationId: logout
      description: 吊销当前 refresh token（cookie 或请求体）并清除 cookie。幂等，什么都没带也返回 204。
      parameters: [{ $ref: '#/components/parameters/ClientPlatform' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses:
        '204': { description: No Content }
  /me:
    get:
      tags: [auth]
      operationId: me
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }

  # ───────────────────────── settings ─────────────────────────
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      description: 首次访问自动创建默认设置。
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    put:
      tags: [settings]
      operationId: putSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutSettingsRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ───────────────────────── tasks ─────────────────────────
  /tasks/today:
    get:
      tags: [tasks]
      operationId: getToday
      description: 返回用户时区下"今天"的任务。若当日无任务，按 settings.weekPlan 的档位与启用模板自动生成（generated=true）。
      parameters:
        - { name: date, in: query, schema: { $ref: '#/components/schemas/IsoDate' }, description: 覆盖"今天"，用于查看/补做其他日 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodayResponse' } } } }
  /tasks/generate:
    post:
      tags: [tasks]
      operationId: generateTasks
      description: 以指定档位为某天生成任务（切换最小日/标准日/冲刺日）。同时改写该日的 dayPlan（v1.2.0 起可经 sync/pull 拿到）。仅在线可用（ONLINE_ONLY_OPERATIONS 中的 tasks.generate）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateTasksRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodayResponse' } } } }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      description: 周计划视图使用 from/to 拉取一周。
      parameters:
        - { name: from, in: query, schema: { $ref: '#/components/schemas/IsoDate' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/IsoDate' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: module, in: query, schema: { $ref: '#/components/schemas/StudyModule' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } }
    post:
      tags: [tasks]
      operationId: createTask
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [tasks]
      operationId: patchTask
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchTaskRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tasks]
      operationId: deleteTask
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除（重复删除同样 204） }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /task-templates:
    get:
      tags: [tasks]
      operationId: listTaskTemplates
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplatePage' } } } }
    post:
      tags: [tasks]
      operationId: createTaskTemplate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskTemplateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /task-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [tasks]
      operationId: getTaskTemplate
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tasks]
      operationId: patchTaskTemplate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchTaskTemplateRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tasks]
      operationId: deleteTaskTemplate
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }

  # ───────────────────────── cards ─────────────────────────
  /cards/due:
    get:
      tags: [cards]
      operationId: getDueCards
      description: 到期复习卡 + 当日剩余新卡额度内的新卡；按 due 升序。
      parameters:
        - { name: deck, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DueCardsResponse' } } } }
  /cards/decks:
    get:
      tags: [cards]
      operationId: listDecks
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DeckSummary' } } } } } }
  /cards/import:
    post:
      tags: [cards]
      operationId: importCards
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCardsRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCardsResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /cards:
    get:
      tags: [cards]
      operationId: listCards
      parameters:
        - { name: deck, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 模糊匹配 front/back/reading }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/CardState' } }
        - { name: tag, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardPage' } } } }
    post:
      tags: [cards]
      operationId: createCard
      description: 单卡创建（阅读生词入卡、查词入卡）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCardRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
  /cards/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [cards]
      operationId: patchCard
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchCardRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [cards]
      operationId: deleteCard
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }
  /cards/{id}/review:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [cards]
      operationId: reviewCard
      description: 记录一次复习并按 FSRS 重新排期。离线复习按 reviewedAt 顺序回放。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCardRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCardResult' } } } }
        '404': { $ref: '#/components/responses/Error' }

  # ───────────────────────── ai ─────────────────────────
  /ai/lookup:
    post:
      tags: [ai]
      operationId: aiLookup
      description: 查词/语法/汉字：解释 + 3 例句 + 3 选择题（答案不下发，用 quiz/check 判分）。同 type+query 结果服务端缓存。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LookupRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LookupResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /ai/quiz/check:
    post:
      tags: [ai]
      operationId: aiQuizCheck
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuizCheckRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QuizCheckResult' } } } }
        '404': { $ref: '#/components/responses/Error' }

  # ───────────────────────── scenarios / conversations ─────────────────────────
  /scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ScenarioCategory' } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/DifficultyLevel' } }
        - { name: register, in: query, schema: { $ref: '#/components/schemas/SpeechRegister' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioPage' } } } }
  /scenarios/{scenarioId}:
    get:
      tags: [scenarios]
      operationId: getScenario
      parameters: [{ name: scenarioId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /conversations:
    get:
      tags: [scenarios]
      operationId: listConversations
      parameters:
        - { name: scenarioId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConversationStatus' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationPage' } } } }
    post:
      tags: [scenarios]
      operationId: createConversation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateConversationRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateConversationResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /conversations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [scenarios]
      operationId: getConversation
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
    patch:
      tags: [scenarios]
      operationId: patchConversation
      description: 结束对话，AI 给出综合评分与总结（在线）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchConversationRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
    delete:
      tags: [scenarios]
      operationId: deleteConversation
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }]
      responses:
        '204': { description: 已软删除 }
  /conversations/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [scenarios]
      operationId: listMessages
      description: 按 createdAt 升序。
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
    post:
      tags: [scenarios]
      operationId: sendMessage
      description: 发送用户消息，返回带批改的用户消息 + AI 回复。对话已结束 → 422。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageResult' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ───────────────────────── mistakes ─────────────────────────
  /mistakes:
    get:
      tags: [mistakes]
      operationId: listMistakes
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/MistakeCategory' } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/MistakeSource' } }
        - { name: mastered, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/MistakeSort' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MistakePage' } } } }
    post:
      tags: [mistakes]
      operationId: createMistake
      description: 同 question+correctAnswer 已存在则 errorCount+1 并返回 200，否则 201。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMistakeRequest' } } } }
      responses:
        '200': { description: 已存在，计数 +1, content: { application/json: { schema: { $ref: '#/components/schemas/Mistake' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Mistake' } } } }
  /mistakes/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [mistakes]
      operationId: patchMistake
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchMistakeRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mistake' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [mistakes]
      operationId: deleteMistake
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }
  /mistakes/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [mistakes]
      operationId: retryMistake
      description: 一键重出：AI 基于原错题生成 1–3 道变式题；判分走 /ai/quiz/check，答错自动累加该错题 errorCount。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WriteMeta' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RetryMistakeResult' } } } }
        '503': { $ref: '#/components/responses/Error' }

  # ───────────────────────── phrases ─────────────────────────
  /phrases:
    get:
      tags: [phrases]
      operationId: listPhrases
      parameters:
        - { name: book, in: query, schema: { $ref: '#/components/schemas/PhraseBook' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: favorite, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PhrasePage' } } } }
    post:
      tags: [phrases]
      operationId: createPhrase
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePhraseRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Phrase' } } } }
  /phrases/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [phrases]
      operationId: getPhrase
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Phrase' } } } }
    patch:
      tags: [phrases]
      operationId: patchPhrase
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchPhraseRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Phrase' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [phrases]
      operationId: deletePhrase
      description: 内置句（builtin=true）不可删除 → 403。
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }
        '403': { $ref: '#/components/responses/Error' }
  /phrases/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [phrases]
      operationId: listPhraseAttempts
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PhraseAttemptPage' } } } }
    post:
      tags: [phrases]
      operationId: createPhraseAttempt
      description: 跟读一次。服务端以 phrase.ja 为参考文本计算分数与差异。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhraseAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PhraseAttempt' } } } }

  # ───────────────────────── speaking ─────────────────────────
