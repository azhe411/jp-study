        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExpressionItemPage' } } } }
  /expressions/attempts:
    get:
      tags: [expressions]
      operationId: listExpressionAttempts
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ExpressionType' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExpressionAttemptPage' } } } }
    post:
      tags: [expressions]
      operationId: createExpressionAttempt
      description: 答错时自动写入错题本（category=keigo|idiom）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExpressionAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExpressionAttempt' } } } }

  # ───────────────────────── kanji ─────────────────────────
  /kanji:
    get:
      tags: [kanji]
      operationId: listKanji
      parameters:
        - { name: level, in: query, schema: { $ref: '#/components/schemas/JlptLevel' } }
        - { name: q, in: query, schema: { type: string }, description: 字或读音 }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KanjiPage' } } } }
  /kanji/attempts:
    post:
      tags: [kanji]
      operationId: createKanjiAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateKanjiAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/KanjiAttempt' } } } }

  # ───────────────────────── vocab test ─────────────────────────
  /vocab-test/start:
    post:
      tags: [vocabTest]
      operationId: startVocabTest
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VocabTestStartRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VocabTestStartResult' } } } }
  /vocab-test/submit:
    post:
      tags: [vocabTest]
      operationId: submitVocabTest
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VocabTestSubmitRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VocabTestResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /vocab-test/history:
    get:
      tags: [vocabTest]
      operationId: vocabTestHistory
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VocabTestResultPage' } } } }

  # ───────────────────────── courses (外链 + 进度) ─────────────────────────
  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CourseStatus' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoursePage' } } } }
    post:
      tags: [courses]
      operationId: createCourse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCourseRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [courses]
      operationId: patchCourse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchCourseRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [courses]
      operationId: deleteCourse
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }, { $ref: '#/components/parameters/BaseVersionQuery' }]
      responses:
        '204': { description: 已软删除 }

  # ───────────────────────── stats ─────────────────────────
  /stats:
    get:
      tags: [stats]
      operationId: getStats
      parameters:
        - { name: from, in: query, schema: { $ref: '#/components/schemas/IsoDate' }, description: 默认今天往前 30 天 }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/IsoDate' }, description: 默认今天 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StatsResponse' } } } }
  /stats/time-logs:
    post:
      tags: [stats]
      operationId: createTimeLog
      description: 上报模块学习时长（各模块时长统计的数据来源）。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTimeLogRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TimeLog' } } } }
  /stats/jlpt-mocks:
    get:
      tags: [stats]
      operationId: listJlptMocks
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/JlptMockPage' } } } }
    post:
      tags: [stats]
      operationId: createJlptMock
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateJlptMockRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/JlptMock' } } } }
  /stats/jlpt-mocks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [stats]
      operationId: deleteJlptMock
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }]
      responses:
        '204': { description: 已软删除 }

  # ───────────────────────── data ─────────────────────────
  /data/export:
    get:
      tags: [data]
      operationId: exportData
      responses:
        '200':
          description: 完整 JSON（Content-Disposition attachment）
          content: { application/json: { schema: { $ref: '#/components/schemas/ExportBundle' } } }
  /data/import:
    post:
      tags: [data]
      operationId: importData
      description: merge=按 id upsert（服务端 version 较新者保留）；replace=软删除现有全部用户数据后导入。请求体上限 20MB。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportDataRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportDataResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /data/backup-status:
    get:
      tags: [data]
      operationId: backupStatus
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BackupStatus' } } } }

  # ───────────────────────── sync ─────────────────────────
  /sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      description: |
        批量推送 outbox。按数组顺序逐条处理，单条失败不影响其他条；整体始终 200（除鉴权/格式错误）。
        每条 op 独立幂等：同 clientOpId 已处理 → status=duplicate 并返回原结果。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      description: 增量拉取。cursor 为空 = 从头全量。按 rev 升序；hasMore=true 时立即用 nextCursor 继续拉。
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullResponse' } } } }
        '410': { $ref: '#/components/responses/Error' }

  # ───────────────────────── v1.3.0：学习计划 / 课程体系 / 视频课程 / 应用更新 ─────────────────────────
  /plan:
    get:
      tags: [plan]
      operationId: getPlan
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPlan' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [plan]
      operationId: putPlan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPlanInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPlan' } } } }
  /plan/preview:
    post:
      tags: [plan]
      operationId: previewPlan
      description: 无副作用，不需 clientOpId。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPlanInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /plan/today:
    get:
      tags: [plan]
      operationId: planToday
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /curriculum:
    get:
      tags: [lessons]
      operationId: getCurriculum
      parameters: [{ name: part, in: query, schema: { type: string, enum: [guide, kana, N5, N4, N3, N2, N1] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /lessons/{lessonId}:
    get:
      tags: [lessons]
      operationId: getLesson
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Error' }
  /lessons/{lessonId}/complete:
    post:
      tags: [lessons]
      operationId: completeLesson
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientOpId, quizId], properties: { clientOpId: { $ref: '#/components/schemas/Uuid' }, quizId: { $ref: '#/components/schemas/Uuid' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /video-courses:
    get:
      tags: [video]
      operationId: listVideoCourses
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /video-courses/{courseId}:
    get:
      tags: [video]
      operationId: getVideoCourse
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /video-progress/{courseId}/{page}:
    put:
      tags: [video]
      operationId: putVideoProgress
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientOpId, positionSec], properties: { clientOpId: { $ref: '#/components/schemas/Uuid' }, positionSec: { type: integer, minimum: 0 }, completed: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /app/manifest:
    get:
      tags: [app]
      operationId: appManifest
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /app/files/{name}:
    get:
      tags: [app]
      operationId: appFile
      security: []
      parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]+$' } }]
      responses:
        '200': { description: 文件内容 }
        '404': { $ref: '#/components/responses/Error' }
  /app/desktop/{target}/{arch}/{currentVersion}:
    get:
      tags: [app]
      operationId: desktopUpdate
      security: []
      parameters:
        - { name: target, in: path, required: true, schema: { type: string } }
        - { name: arch, in: path, required: true, schema: { type: string } }
        - { name: currentVersion, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Tauri 更新器协议, content: { application/json: { schema: { type: object } } } }
        '204': { description: 已是最新 }

  /me/ai-key:
    get:
      tags: [auth]
      operationId: getAiKey
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
    put:
      tags: [auth]
      operationId: putAiKey
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientOpId, apiKey], properties: { clientOpId: { $ref: '#/components/schemas/Uuid' }, apiKey: { type: string, minLength: 10, maxLength: 200 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      operationId: deleteAiKey
      parameters: [{ $ref: '#/components/parameters/ClientOpIdQuery' }]
      responses:
        '204': { description: 已删除 }

  /tts:
    post:
      tags: [lessons]
      operationId: createTts
      description: 见 CONTRACT.md §18（无需 clientOpId）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 400 } } } } } }
      responses:
        '200': { description: TtsResult, content: { application/json: { schema: { type: object, properties: { key: { type: string }, url: { type: string }, voice: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /tts/{file}:
    get:
      tags: [lessons]
      operationId: getTtsFile
      security: []
      parameters: [{ name: file, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{40}\.mp3$' } }]
      responses:
        '200': { description: mp3, content: { audio/mpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /route/today:
    get:
      tags: [lessons]
      operationId: getDailyRoute
      description: 见 CONTRACT.md §19
      responses:
        '200': { description: DailyRoute, content: { application/json: { schema: { type: object } } } }
  /lessons/{lessonId}/practice:
    post:
      tags: [lessons]
      operationId: saveLessonPractice
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientOpId, correct, total], properties: { clientOpId: { $ref: '#/components/schemas/Uuid' }, correct: { type: integer, minimum: 0 }, total: { type: integer, minimum: 1 } } } } } }
      responses:
        '200': { description: LessonPracticeResult, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
  /coach/daily:
    get: { tags: [lessons], operationId: getCoachDaily, description: 见 CONTRACT.md §20, responses: { '200': { description: CoachNote, content: { application/json: { schema: { type: object } } } } } }
  /coach/weekly:
    get: { tags: [lessons], operationId: getCoachWeekly, responses: { '200': { description: CoachNote, content: { application/json: { schema: { type: object } } } } } }
  /coach/lessons/{lessonId}:
    get:
      tags: [lessons]
      operationId: getCoachLesson
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: CoachNote, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/Error' }
  /coach/notes:
    get: { tags: [lessons], operationId: listCoachNotes, parameters: [{ $ref: '#/components/parameters/Limit' }], responses: { '200': { description: 最近的小结, content: { application/json: { schema: { type: object } } } } } }
  /coach/notes/{id}/read:
    post:
      tags: [lessons]
      operationId: readCoachNote
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientOpId], properties: { clientOpId: { $ref: '#/components/schemas/Uuid' } } } } } }
      responses:
        '200': { description: CoachNote, content: { application/json: { schema: { type: object } } } }

  /learn/stage:
    get:
      tags: [lessons]
      operationId: getLearningStage
      description: 见 CONTRACT.md §21
      responses:
        '200': { description: StageInfo, content: { application/json: { schema: { type: object } } } }
  /app/models/{name}:
    get:
      tags: [system]
      operationId: getRecognitionModel
      security: []
      parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,120}$' } }]
      responses:
        '200': { description: 模型压缩包, content: { application/gzip: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }

  /coach/live:
    get: { tags: [lessons], operationId: getCoachLive, description: 见 CONTRACT.md §22, responses: { '200': { description: CoachNote, content: { application/json: { schema: { type: object } } } } } }

  /cards/restudy:
    get: { tags: [cards], operationId: getRestudyGroups, description: 见 CONTRACT.md §24, responses: { '200': { description: RestudyGroups, content: { application/json: { schema: { type: object } } } } } }
  /cards/restudy/rounds:
    post: { tags: [cards], operationId: postRestudyRound, description: 见 CONTRACT.md §25, requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '201': { description: RestudyRoundResult, content: { application/json: { schema: { type: object } } } } } }
  /cards/restudy/items:
    get: { tags: [cards], operationId: getRestudyItems, description: date、lessonId、hard 三选一, parameters: [{ name: date, in: query, schema: { type: string } }, { name: lessonId, in: query, schema: { type: string } }], responses: { '200': { description: 卡片, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  headers:
    RefreshCookie:
      description: "jp_rt=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000"
      schema: { type: string }

  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: 不透明游标，取自上一页 nextCursor }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ClientOpIdQuery: { name: clientOpId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' }, description: DELETE 无请求体，幂等键走 query }
    BaseVersionQuery: { name: baseVersion, in: query, schema: { type: integer, minimum: 1 } }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: 缺省 web。android / desktop 时 refresh token 走请求/响应体、不设 cookie
      schema: { type: string, enum: [web, android, desktop], default: web }

  responses:
    Error:
      description: 统一错误响应
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  schemas:
    # ── 基础 ──
    Uuid: { type: string, format: uuid }
    IsoDateTime: { type: string, format: date-time, description: 'ISO 8601 带时区，如 2026-10-28T09:30:00Z' }
    IsoDate: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
    NullableString: { type: [string, 'null'] }
    NullableInt: { type: [integer, 'null'] }
    BaseEntity:
      type: object
      required: [id, createdAt, updatedAt, deletedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        updatedAt: { $ref: '#/components/schemas/IsoDateTime' }
        deletedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    WriteMeta:
      type: object
      required: [clientOpId]
      properties:
        clientOpId: { $ref: '#/components/schemas/Uuid' }
    VersionedWrite:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          properties:
            baseVersion: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 中文友好提示 }
            details: {}
            requestId: { type: string }
      example: { error: { code: VALIDATION_FAILED, message: 请求参数不正确, details: [{ path: /title, message: 不能为空 }], requestId: req_01HF } }

    # ── 枚举（值与 shared/constants.ts 一致）──
    ErrorCode: { type: string, enum: [VALIDATION_FAILED, INVALID_JSON, UNAUTHORIZED, TOKEN_EXPIRED, REFRESH_TOKEN_INVALID, INVALID_CREDENTIALS, FORBIDDEN, NOT_FOUND, EMAIL_TAKEN, VERSION_CONFLICT, SYNC_CURSOR_EXPIRED, PAYLOAD_TOO_LARGE, IDEMPOTENCY_KEY_REUSED, UNPROCESSABLE, RATE_LIMITED, INTERNAL_ERROR, AI_BAD_OUTPUT, AI_UNAVAILABLE, AI_TIMEOUT, AI_KEY_REQUIRED, TTS_UNAVAILABLE] }
    JlptLevel: { type: string, enum: [N5, N4, N3, N2, N1] }
    DifficultyLevel: { type: string, enum: [N5, N4, N3, N2, N1, business] }
    SpeechRegister: { type: string, enum: [plain, polite, keigo] }
    StudyModule: { type: string, enum: [flashcards, scenario, lookup, mistakes, phrases, speaking, listening, writing, reading, pronunciation, keigo, idiom, kanji, vocabTest, course, other] }
    DayMode: { type: string, enum: [minimal, standard, sprint] }
    Weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
    TaskStatus: { type: string, enum: [todo, done, skipped] }
    CardState: { type: string, enum: [new, learning, review, relearning] }
    ReviewRating: { type: integer, enum: [1, 2, 3, 4] }
    CardSource: { type: string, enum: [manual, import, lookup, reading, mistake, phrase, kanji] }
    LookupType: { type: string, enum: [word, grammar, kanji] }
    ScenarioCategory: { type: string, enum: [travel, dailyLife, social, workplace, academic, culture, emergency, entertainment, emotion] }
    ConversationStatus: { type: string, enum: [active, finished] }
    MessageRole: { type: string, enum: [user, assistant, system] }
    MistakeCategory: { type: string, enum: [vocab, grammar, kanji, particle, conjugation, keigo, idiom, listening, pronunciation, writing, reading, other] }
    MistakeSource: { type: string, enum: [quiz, conversation, writing, dictation, reading, pronunciation, expression, kanji, vocabTest, manual] }
    MistakeSort: { type: string, enum: [errorCountDesc, lastWrongDesc, createdDesc] }
    PhraseBook: { type: string, enum: [travel, life] }
    SpeakingMode: { type: string, enum: [reading, shadowing] }
    SpeakingSourceType: { type: string, enum: [phrase, reading, listening, scenario, custom] }
    RecognitionMethod: { type: string, enum: [webSpeech, nativeSpeech, offlineSpeech, selfAssessed, textCompare] }
    ListeningMode: { type: string, enum: [blind, subtitle, intensive, dictation] }
    DiffOp: { type: string, enum: [equal, insert, delete, replace] }
    WritingKind: { type: string, enum: [diary, essay, email, free] }
    WritingStatus: { type: string, enum: [draft, submitted, corrected, failed] }
    CorrectionType: { type: string, enum: [grammar, vocab, particle, conjugation, kanji, register, naturalness, punctuation] }
    PronunciationCategory: { type: string, enum: [longVowel, sokuon, hatsuon, dakuon, youon, pitchAccent, other] }
    PronunciationMode: { type: string, enum: [listen, speak] }
    ExpressionType: { type: string, enum: [keigo, idiom] }
    ExpressionDrillMode: { type: string, enum: [meaning, convert, fillBlank] }
    KanjiDrillMode: { type: string, enum: [reading, meaning, writing] }
    VocabTestItemKind: { type: string, enum: [yesNo, choice] }
    CoursePlatform: { type: string, enum: [bilibili, youtube, other] }
    CourseStatus: { type: string, enum: [planned, inProgress, paused, completed] }
    Theme: { type: string, enum: [system, light, dark] }
    FuriganaMode: { type: string, enum: [always, unknownOnly, never] }
    ImportMode: { type: string, enum: [merge, replace] }
    SyncEntity: { type: string, enum: [settings, task, dayPlan, taskTemplate, card, reviewLog, mistake, phrase, phraseAttempt, speakingAttempt, listeningAttempt, readingAttempt, pronunciationAttempt, expressionAttempt, kanjiAttempt, writingEntry, conversation, message, vocabTestResult, course, timeLog, jlptMock, studyPlan, lessonProgress, videoProgress] }
    PushableEntity: { type: string, enum: [settings, task, taskTemplate, card, reviewLog, mistake, phrase, phraseAttempt, speakingAttempt, listeningAttempt, readingAttempt, pronunciationAttempt, expressionAttempt, kanjiAttempt, writingEntry, course, timeLog, jlptMock, videoProgress] }
    SyncOpAction: { type: string, enum: [create, update, delete] }
    SyncResultStatus: { type: string, enum: [applied, duplicate, conflict, rejected] }

    # ── system / auth ──
    HealthResponse:
      type: object
      required: [status, version, contractVersion, db, ai, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        contractVersion: { type: string }
        db: { type: string, enum: [ok, down] }
        ai: { type: string, enum: [configured, missing] }
        time: { $ref: '#/components/schemas/IsoDateTime' }
        minClientVersion: { type: string, description: 'v1.2.0：服务端仍兼容的最低客户端版本（semver）；未设置时不返回' }
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 40 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceId: { type: string, maxLength: 64 }
    AuthResult:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        refreshToken: { type: string, description: 仅原生 App 返回；每次刷新都轮换，必须覆盖保存 }
        refreshExpiresIn: { type: integer, description: 仅原生 App 返回（秒） }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string, maxLength: 200, description: 仅原生 App 传；web 不传，走 cookie }
    MeResponse:
      type: object
      required: [user, serverTime]
      properties:
        user: { $ref: '#/components/schemas/User' }
        serverTime: { $ref: '#/components/schemas/IsoDateTime' }

    # ── settings ──
    SettingsData:
      type: object
      required: [timezone, weekPlan, dailyGoalMinutes, jlptTarget, newCardsPerDay, reviewLimitPerDay, defaultDeck, speechRate, ttsVoice, furiganaMode, theme, desiredRetention]
      properties:
        timezone: { type: string, default: Asia/Shanghai }
        weekPlan:
          type: object
          required: [mon, tue, wed, thu, fri, sat, sun]
          properties:
            mon: { $ref: '#/components/schemas/DayMode' }
            tue: { $ref: '#/components/schemas/DayMode' }
            wed: { $ref: '#/components/schemas/DayMode' }
            thu: { $ref: '#/components/schemas/DayMode' }
            fri: { $ref: '#/components/schemas/DayMode' }
            sat: { $ref: '#/components/schemas/DayMode' }
            sun: { $ref: '#/components/schemas/DayMode' }
        dailyGoalMinutes: { type: integer, minimum: 5, maximum: 600 }
        jlptTarget: { $ref: '#/components/schemas/JlptLevel' }
        newCardsPerDay: { type: integer, minimum: 0, maximum: 500 }
        reviewLimitPerDay: { type: integer, minimum: 0, maximum: 5000 }
        defaultDeck: { type: string, minLength: 1, maxLength: 60 }
        speechRate: { type: number, minimum: 0.5, maximum: 1.5 }
        ttsVoice: { type: [string, 'null'] }
        furiganaMode: { $ref: '#/components/schemas/FuriganaMode' }
        theme: { $ref: '#/components/schemas/Theme' }
        desiredRetention: { type: number, minimum: 0.7, maximum: 0.97 }
    Settings:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/SettingsData' } }
    PutSettingsRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/SettingsData' } }

    # ── tasks ──
    Task:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [date, title, module, targetMinutes, targetCount, status, templateId, sortOrder, link, note, completedAt]
          properties:
            date: { $ref: '#/components/schemas/IsoDate' }
            title: { type: string, maxLength: 120 }
            module: { $ref: '#/components/schemas/StudyModule' }
            targetMinutes: { $ref: '#/components/schemas/NullableInt' }
            targetCount: { $ref: '#/components/schemas/NullableInt' }
            status: { $ref: '#/components/schemas/TaskStatus' }
            templateId: { type: [string, 'null'], format: uuid }
            sortOrder: { type: integer }
            link: { type: [string, 'null'], format: uri }
            note: { $ref: '#/components/schemas/NullableString' }
            completedAt: { type: [string, 'null'], format: date-time }
    CreateTaskRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [date, title, module]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            date: { $ref: '#/components/schemas/IsoDate' }
            title: { type: string, minLength: 1, maxLength: 120 }
            module: { $ref: '#/components/schemas/StudyModule' }
            targetMinutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
            targetCount: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
            sortOrder: { type: integer }
            link: { type: [string, 'null'], format: uri }
            note: { type: [string, 'null'], maxLength: 1000 }
    PatchTaskRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            title: { type: string, minLength: 1, maxLength: 120 }
            module: { $ref: '#/components/schemas/StudyModule' }
            date: { $ref: '#/components/schemas/IsoDate' }
            targetMinutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
            targetCount: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
            status: { $ref: '#/components/schemas/TaskStatus' }
            sortOrder: { type: integer }
            link: { type: [string, 'null'], format: uri }
            note: { type: [string, 'null'], maxLength: 1000 }
    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    StudyPlanInput:
      type: object
      required: [startLevel, goal, targetDate, dailyMinutes, reminderTime, lateReminder]
      properties:
        clientOpId: { $ref: '#/components/schemas/Uuid' }
        baseVersion: { type: integer, minimum: 1 }
        startLevel: { type: string, enum: [zero, kana, N5, N4, N3, N2] }
        goal: { type: string, enum: [N5, N4, N3, N2, N1, travel, conversation] }
        targetDate: { $ref: '#/components/schemas/IsoDate' }
        dailyMinutes: { type: integer, minimum: 10, maximum: 600 }
        reminderTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        lateReminder: { type: boolean }
    StudyPlan:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - { $ref: '#/components/schemas/StudyPlanInput' }
        - type: object
          required: [startDate]
          properties: { startDate: { $ref: '#/components/schemas/IsoDate' } }
    DayPlan:
      description: v1.2.0：某天实际采用的档位，只读同步实体（不可 push）
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [date, dayMode]
          properties:
            date: { $ref: '#/components/schemas/IsoDate' }
            dayMode: { $ref: '#/components/schemas/DayMode' }
    TodayResponse:
      type: object
      required: [date, dayMode, generated, tasks, summary]
      properties:
        date: { $ref: '#/components/schemas/IsoDate' }
        dayMode: { $ref: '#/components/schemas/DayMode' }
        generated: { type: boolean }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        summary:
          type: object
          required: [total, done, plannedMinutes, studiedMinutes, dueCards]
          properties:
            total: { type: integer }
            done: { type: integer }
            plannedMinutes: { type: integer }
            studiedMinutes: { type: integer }
            dueCards: { type: integer }
    GenerateTasksRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [date, dayMode]
          properties:
            date: { $ref: '#/components/schemas/IsoDate' }
            dayMode: { $ref: '#/components/schemas/DayMode' }
            regenerate: { type: boolean, default: false }
    TaskTemplate:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [title, module, dayModes, weekdays, targetMinutes, targetCount, sortOrder, active, link]
          properties:
            title: { type: string }
            module: { $ref: '#/components/schemas/StudyModule' }
            dayModes: { type: array, items: { $ref: '#/components/schemas/DayMode' }, minItems: 1, uniqueItems: true }
            weekdays: { type: array, items: { $ref: '#/components/schemas/Weekday' }, uniqueItems: true }
            targetMinutes: { $ref: '#/components/schemas/NullableInt' }
            targetCount: { $ref: '#/components/schemas/NullableInt' }
            sortOrder: { type: integer }
            active: { type: boolean }
            link: { type: [string, 'null'], format: uri }
    CreateTaskTemplateRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [title, module, dayModes]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            title: { type: string, minLength: 1, maxLength: 120 }
            module: { $ref: '#/components/schemas/StudyModule' }
            dayModes: { type: array, items: { $ref: '#/components/schemas/DayMode' }, minItems: 1, uniqueItems: true }
            weekdays: { type: array, items: { $ref: '#/components/schemas/Weekday' }, uniqueItems: true }
            targetMinutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
            targetCount: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
            sortOrder: { type: integer }
            active: { type: boolean, default: true }
            link: { type: [string, 'null'], format: uri }
    PatchTaskTemplateRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            title: { type: string, minLength: 1, maxLength: 120 }
            module: { $ref: '#/components/schemas/StudyModule' }
            dayModes: { type: array, items: { $ref: '#/components/schemas/DayMode' }, minItems: 1, uniqueItems: true }
            weekdays: { type: array, items: { $ref: '#/components/schemas/Weekday' }, uniqueItems: true }
            targetMinutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
            targetCount: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
            sortOrder: { type: integer }
            active: { type: boolean }
            link: { type: [string, 'null'], format: uri }
    TaskTemplatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaskTemplate' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }

    # ── cards ──
    FsrsState:
      type: object
      required: [state, due, stability, difficulty, elapsedDays, scheduledDays, reps, lapses, lastReviewAt]
      properties:
        state: { $ref: '#/components/schemas/CardState' }
        due: { $ref: '#/components/schemas/IsoDateTime' }
        stability: { type: number }
        difficulty: { type: number }
        elapsedDays: { type: number }
        scheduledDays: { type: number }
        reps: { type: integer }
        lapses: { type: integer }
        lastReviewAt: { type: [string, 'null'], format: date-time }
    CardInput:
      type: object
      required: [front, back]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deck: { type: string, minLength: 1, maxLength: 60 }
        front: { type: string, minLength: 1, maxLength: 500 }
        back: { type: string, minLength: 1, maxLength: 2000 }
        reading: { type: [string, 'null'], maxLength: 500 }
        example: { type: [string, 'null'], maxLength: 1000 }
        exampleTranslation: { type: [string, 'null'], maxLength: 1000 }
        tags: { type: array, items: { type: string, maxLength: 30 }, maxItems: 20 }
        source: { $ref: '#/components/schemas/CardSource' }
        sourceRef: { $ref: '#/components/schemas/NullableString' }
        jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
    Card:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [deck, front, back, reading, example, exampleTranslation, tags, source, sourceRef, jlptLevel, suspended, srs]
          properties:
            deck: { type: string }
            front: { type: string }
            back: { type: string }
            reading: { $ref: '#/components/schemas/NullableString' }
            example: { $ref: '#/components/schemas/NullableString' }
            exampleTranslation: { $ref: '#/components/schemas/NullableString' }
            tags: { type: array, items: { type: string } }
            source: { $ref: '#/components/schemas/CardSource' }
            sourceRef: { $ref: '#/components/schemas/NullableString' }
            jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
            suspended: { type: boolean }
            srs: { $ref: '#/components/schemas/FsrsState' }
    CreateCardRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - { $ref: '#/components/schemas/CardInput' }
    PatchCardRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            deck: { type: string, minLength: 1, maxLength: 60 }
            front: { type: string, minLength: 1, maxLength: 500 }
            back: { type: string, minLength: 1, maxLength: 2000 }
            reading: { type: [string, 'null'] }
            example: { type: [string, 'null'] }
            exampleTranslation: { type: [string, 'null'] }
            tags: { type: array, items: { type: string, maxLength: 30 }, maxItems: 20 }
            jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
            suspended: { type: boolean }
    ImportCardsRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [deck, cards]
          properties:
            deck: { type: string, minLength: 1, maxLength: 60 }
            cards: { type: array, items: { $ref: '#/components/schemas/CardInput' }, minItems: 1, maxItems: 2000 }
            updateExisting: { type: boolean, default: false }
    ImportCardsResult:
      type: object
      required: [created, updated, skipped, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors: { type: array, items: { type: object, required: [index, message], properties: { index: { type: integer }, message: { type: string } } } }
    DueCardsResponse:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Card' } }
        counts:
          type: object
          required: [new, learning, review]
          properties: { new: { type: integer }, learning: { type: integer }, review: { type: integer } }
    DeckSummary:
      type: object
      required: [deck, total, due, new]
      properties: { deck: { type: string }, total: { type: integer }, due: { type: integer }, new: { type: integer } }
    CardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Card' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    ReviewLog:
      type: object
      required: [id, cardId, rating, reviewedAt, durationMs, stateBefore, scheduledDaysAfter, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        cardId: { $ref: '#/components/schemas/Uuid' }
        rating: { $ref: '#/components/schemas/ReviewRating' }
        reviewedAt: { $ref: '#/components/schemas/IsoDateTime' }
        durationMs: { type: integer }
        stateBefore: { $ref: '#/components/schemas/CardState' }
        scheduledDaysAfter: { type: number }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    ReviewCardRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [rating, reviewedAt, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            rating: { $ref: '#/components/schemas/ReviewRating' }
            reviewedAt: { $ref: '#/components/schemas/IsoDateTime' }
            durationMs: { type: integer, minimum: 0, maximum: 3600000 }
    ReviewCardResult:
      type: object
      required: [card, log]
      properties:
        card: { $ref: '#/components/schemas/Card' }
        log: { $ref: '#/components/schemas/ReviewLog' }

    # ── ai ──
    Example:
      type: object
      required: [ja, reading, zh]
      properties: { ja: { type: string }, reading: { type: string }, zh: { type: string } }
    QuizQuestion:
      type: object
      required: [id, stem, options]
      properties:
        id: { type: string }
        stem: { type: string }
        options: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }
    Quiz:
      type: object
      required: [quizId, expiresAt, questions]
      properties:
        quizId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        questions: { type: array, items: { $ref: '#/components/schemas/QuizQuestion' } }
    LookupRequest:
      type: object
      required: [type, query]
      properties:
        type: { $ref: '#/components/schemas/LookupType' }
        query: { type: string, minLength: 1, maxLength: 60 }
        context: { type: string, maxLength: 300 }
    LookupBase:
      type: object
      required: [type, query, examples, quiz, cached]
      properties:
        type: { $ref: '#/components/schemas/LookupType' }
        query: { type: string }
        examples: { type: array, items: { $ref: '#/components/schemas/Example' }, minItems: 3, maxItems: 3 }
        quiz: { $ref: '#/components/schemas/Quiz' }
        cached: { type: boolean }
    WordLookup:
      allOf:
        - { $ref: '#/components/schemas/LookupBase' }
        - type: object
          required: [headword, reading, partOfSpeech, meaningsZh, jlptLevel, explanationZh, pitchAccent]
          properties:
            type: { const: word }
            headword: { type: string }
            reading: { type: string }
            partOfSpeech: { type: string }
            meaningsZh: { type: array, items: { type: string } }
            jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
            explanationZh: { type: string }
            pitchAccent: { $ref: '#/components/schemas/NullableString' }
    GrammarLookup:
      allOf:
        - { $ref: '#/components/schemas/LookupBase' }
        - type: object
          required: [pattern, meaningZh, connection, nuanceZh, register, jlptLevel, similarPatterns]
          properties:
            type: { const: grammar }
            pattern: { type: string }
            meaningZh: { type: string }
            connection: { type: string }
            nuanceZh: { type: string }
            register: { oneOf: [{ $ref: '#/components/schemas/SpeechRegister' }, { type: 'null' }] }
            jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
            similarPatterns: { type: array, items: { type: string } }
    KanjiLookup:
      allOf:
        - { $ref: '#/components/schemas/LookupBase' }
        - type: object
          required: [character, onyomi, kunyomi, strokeCount, radical, meaningsZh, jlptLevel, commonWords]
          properties:
            type: { const: kanji }
            character: { type: string, minLength: 1, maxLength: 1 }
            onyomi: { type: array, items: { type: string } }
            kunyomi: { type: array, items: { type: string } }
            strokeCount: { type: integer }
            radical: { type: string }
            meaningsZh: { type: array, items: { type: string } }
            jlptLevel: { oneOf: [{ $ref: '#/components/schemas/JlptLevel' }, { type: 'null' }] }
            commonWords: { type: array, items: { $ref: '#/components/schemas/CommonWord' } }
    CommonWord:
      type: object
      required: [word, reading, meaningZh]
      properties: { word: { type: string }, reading: { type: string }, meaningZh: { type: string } }
    LookupResult:
      oneOf:
        - { $ref: '#/components/schemas/WordLookup' }
        - { $ref: '#/components/schemas/GrammarLookup' }
        - { $ref: '#/components/schemas/KanjiLookup' }
      discriminator: { propertyName: type }
    QuizCheckRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [quizId, answers]
          properties:
            quizId: { $ref: '#/components/schemas/Uuid' }
            answers:
              type: array
              minItems: 1
              items: { type: object, required: [questionId, choiceIndex], properties: { questionId: { type: string }, choiceIndex: { type: integer, minimum: 0, maximum: 3 } } }
            recordMistakes: { type: boolean, default: true }
    QuizCheckResult:
      type: object
      required: [correctCount, total, results]
      properties:
        correctCount: { type: integer }
        total: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [questionId, correct, choiceIndex, answerIndex, explanationZh, mistakeId]
            properties:
              questionId: { type: string }
              correct: { type: boolean }
              choiceIndex: { type: integer }
              answerIndex: { type: integer }
              explanationZh: { type: string }
              mistakeId: { type: [string, 'null'], format: uuid }

    # ── scenarios / conversations ──
    Scenario:
      type: object
      required: [id, category, title, titleJa, description, level, register, aiRole, userRole, goals, keyPhrases, progress]
      properties:
        id: { type: string, description: 稳定 slug，如 travel-hotel-checkin }
        category: { $ref: '#/components/schemas/ScenarioCategory' }
        title: { type: string }
        titleJa: { type: string }
        description: { type: string }
        level: { $ref: '#/components/schemas/DifficultyLevel' }
        register: { $ref: '#/components/schemas/SpeechRegister' }
        aiRole: { type: string }
        userRole: { type: string }
        goals: { type: array, items: { type: string } }
        keyPhrases: { type: array, items: { type: string } }
        progress:
          type: object
          required: [attempts, bestScore, mastered]
          properties: { attempts: { type: integer }, bestScore: { $ref: '#/components/schemas/NullableInt' }, mastered: { type: boolean } }
    ScenarioPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Scenario' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    Conversation:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [scenarioId, register, status, title, messageCount, score, summary, finishedAt]
          properties:
            scenarioId: { type: string }
            register: { $ref: '#/components/schemas/SpeechRegister' }
            status: { $ref: '#/components/schemas/ConversationStatus' }
            title: { type: string }
            messageCount: { type: integer }
            score: { $ref: '#/components/schemas/NullableInt' }
            summary: { $ref: '#/components/schemas/NullableString' }
            finishedAt: { type: [string, 'null'], format: date-time }
    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateConversationRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [scenarioId]
          properties:
            scenarioId: { type: string }
            register: { $ref: '#/components/schemas/SpeechRegister' }
    CreateConversationResult:
      type: object
      required: [conversation, openingMessage]
      properties:
        conversation: { $ref: '#/components/schemas/Conversation' }
        openingMessage: { $ref: '#/components/schemas/Message' }
    PatchConversationRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          required: [status]
          properties: { status: { const: finished } }
    Correction:
      type: object
      required: [original, corrected, explanationZh, type]
      properties:
        original: { type: string }
        corrected: { type: string }
        explanationZh: { type: string }
        type: { $ref: '#/components/schemas/CorrectionType' }
    MessageFeedback:
      type: object
      required: [corrections, naturalAlternative, registerNote, score]
      properties:
        corrections: { type: array, items: { $ref: '#/components/schemas/Correction' } }
        naturalAlternative: { $ref: '#/components/schemas/NullableString' }
        registerNote: { $ref: '#/components/schemas/NullableString' }
        score: { type: integer, minimum: 0, maximum: 100 }
    Message:
      type: object
      required: [id, conversationId, role, content, translationZh, reading, feedback, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/MessageRole' }
        content: { type: string }
        translationZh: { $ref: '#/components/schemas/NullableString' }
        reading: { $ref: '#/components/schemas/NullableString' }
        feedback: { oneOf: [{ $ref: '#/components/schemas/MessageFeedback' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    SendMessageRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [content]
          properties: { content: { type: string, minLength: 1, maxLength: 500 } }
    SendMessageResult:
      type: object
      required: [userMessage, assistantMessage, conversation]
      properties:
        userMessage: { $ref: '#/components/schemas/Message' }
        assistantMessage: { $ref: '#/components/schemas/Message' }
        conversation: { $ref: '#/components/schemas/Conversation' }

    # ── mistakes ──
    Mistake:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [category, source, sourceRef, question, wrongAnswer, correctAnswer, explanationZh, errorCount, lastWrongAt, mastered, masteredAt, tags]
          properties:
            category: { $ref: '#/components/schemas/MistakeCategory' }
            source: { $ref: '#/components/schemas/MistakeSource' }
            sourceRef: { $ref: '#/components/schemas/NullableString' }
            question: { type: string }
            wrongAnswer: { type: string }
            correctAnswer: { type: string }
            explanationZh: { $ref: '#/components/schemas/NullableString' }
            errorCount: { type: integer, minimum: 1 }
            lastWrongAt: { $ref: '#/components/schemas/IsoDateTime' }
            mastered: { type: boolean }
            masteredAt: { type: [string, 'null'], format: date-time }
            tags: { type: array, items: { type: string } }
    MistakePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Mistake' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateMistakeRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [category, question, wrongAnswer, correctAnswer]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            category: { $ref: '#/components/schemas/MistakeCategory' }
            source: { $ref: '#/components/schemas/MistakeSource' }
            sourceRef: { $ref: '#/components/schemas/NullableString' }
            question: { type: string, minLength: 1, maxLength: 1000 }
            wrongAnswer: { type: string, maxLength: 1000 }
            correctAnswer: { type: string, minLength: 1, maxLength: 1000 }
            explanationZh: { type: [string, 'null'], maxLength: 2000 }
            tags: { type: array, items: { type: string, maxLength: 30 }, maxItems: 20 }
    PatchMistakeRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            category: { $ref: '#/components/schemas/MistakeCategory' }
            explanationZh: { type: [string, 'null'], maxLength: 2000 }
            mastered: { type: boolean }
            tags: { type: array, items: { type: string, maxLength: 30 }, maxItems: 20 }
            incrementError: { type: boolean }
    RetryMistakeResult:
      type: object
      required: [mistakeId, quiz]
      properties:
        mistakeId: { $ref: '#/components/schemas/Uuid' }
        quiz: { $ref: '#/components/schemas/Quiz' }

    # ── phrases ──
    Phrase:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [book, category, ja, reading, zh, note, builtin, favorite, bestScore, attemptCount]
          properties:
            book: { $ref: '#/components/schemas/PhraseBook' }
            category: { type: string }
            ja: { type: string }
            reading: { type: string }
            zh: { type: string }
            note: { $ref: '#/components/schemas/NullableString' }
            builtin: { type: boolean }
            favorite: { type: boolean }
            bestScore: { $ref: '#/components/schemas/NullableInt' }
            attemptCount: { type: integer }
    PhrasePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Phrase' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreatePhraseRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [book, category, ja, reading, zh]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            book: { $ref: '#/components/schemas/PhraseBook' }
            category: { type: string, minLength: 1, maxLength: 40 }
            ja: { type: string, minLength: 1, maxLength: 300 }
            reading: { type: string, minLength: 1, maxLength: 600 }
            zh: { type: string, minLength: 1, maxLength: 300 }
            note: { type: [string, 'null'], maxLength: 1000 }
    PatchPhraseRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            category: { type: string, minLength: 1, maxLength: 40 }
            ja: { type: string, minLength: 1, maxLength: 300 }
            reading: { type: string, minLength: 1, maxLength: 600 }
            zh: { type: string, minLength: 1, maxLength: 300 }
            note: { type: [string, 'null'], maxLength: 1000 }
            favorite: { type: boolean }
    SpeechScores:
      type: object
      required: [accuracy, fluency, completeness, overall]
      properties:
        accuracy: { type: integer, minimum: 0, maximum: 100 }
        fluency: { type: integer, minimum: 0, maximum: 100 }
        completeness: { type: integer, minimum: 0, maximum: 100 }
        overall: { type: integer, minimum: 0, maximum: 100 }
    DiffSegment:
      type: object
      required: [op, expected, actual]
      properties:
        op: { $ref: '#/components/schemas/DiffOp' }
        expected: { type: string }
        actual: { type: string }
    PhraseAttempt:
      type: object
      required: [id, phraseId, transcript, method, durationMs, scores, diff, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        phraseId: { $ref: '#/components/schemas/Uuid' }
        transcript: { type: string }
        method: { $ref: '#/components/schemas/RecognitionMethod' }
        durationMs: { type: integer }
        scores: { $ref: '#/components/schemas/SpeechScores' }
        diff: { type: array, items: { $ref: '#/components/schemas/DiffSegment' } }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    PhraseAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PhraseAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    PhraseAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [transcript, method, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            transcript: { type: string, maxLength: 1000 }
            method: { $ref: '#/components/schemas/RecognitionMethod' }
            durationMs: { type: integer, minimum: 0, maximum: 600000 }
            selfScore: { type: integer, minimum: 0, maximum: 100 }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── speaking ──
    SpeakingAttempt:
      type: object
      required: [id, mode, sourceType, sourceId, referenceText, transcript, method, durationMs, scores, diff, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/SpeakingMode' }
        sourceType: { $ref: '#/components/schemas/SpeakingSourceType' }
        sourceId: { $ref: '#/components/schemas/NullableString' }
        referenceText: { type: string }
        transcript: { type: string }
        method: { $ref: '#/components/schemas/RecognitionMethod' }
        durationMs: { type: integer }
        scores: { $ref: '#/components/schemas/SpeechScores' }
        diff: { type: array, items: { $ref: '#/components/schemas/DiffSegment' } }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    SpeakingAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SpeakingAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateSpeakingAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [mode, sourceType, referenceText, transcript, method, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            mode: { $ref: '#/components/schemas/SpeakingMode' }
            sourceType: { $ref: '#/components/schemas/SpeakingSourceType' }
            sourceId: { $ref: '#/components/schemas/NullableString' }
            referenceText: { type: string, minLength: 1, maxLength: 3000 }
            transcript: { type: string, maxLength: 3000 }
            method: { $ref: '#/components/schemas/RecognitionMethod' }
            durationMs: { type: integer, minimum: 0, maximum: 1800000 }
            selfScore: { type: integer, minimum: 0, maximum: 100 }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── listening ──
    ListeningSegment:
      type: object
      required: [index, text, reading, zh, startSec, endSec]
      properties:
        index: { type: integer }
        text: { type: string }
        reading: { type: string }
        zh: { type: string }
        startSec: { type: [number, 'null'] }
        endSec: { type: [number, 'null'] }
    ListeningMaterialSummary:
      type: object
      required: [id, title, level, topic, durationSec, segmentCount, audioUrl]
      properties:
        id: { type: string }
        title: { type: string }
        level: { $ref: '#/components/schemas/DifficultyLevel' }
        topic: { type: string }
        durationSec: { type: [number, 'null'] }
        segmentCount: { type: integer }
        audioUrl: { type: [string, 'null'], format: uri }
    ListeningMaterial:
      allOf:
        - { $ref: '#/components/schemas/ListeningMaterialSummary' }
        - type: object
          required: [segments]
          properties: { segments: { type: array, items: { $ref: '#/components/schemas/ListeningSegment' } } }
    ListeningMaterialPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ListeningMaterialSummary' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    DictationRequest:
      type: object
      required: [materialId, segmentIndex, answer]
      properties:
        materialId: { type: string }
        segmentIndex: { type: integer, minimum: 0 }
        answer: { type: string, maxLength: 1000 }
    DictationResult:
      type: object
      required: [materialId, segmentIndex, expected, answer, accuracy, diff]
      properties:
        materialId: { type: string }
        segmentIndex: { type: integer }
        expected: { type: string }
        answer: { type: string }
        accuracy: { type: integer, minimum: 0, maximum: 100 }
        diff: { type: array, items: { $ref: '#/components/schemas/DiffSegment' } }
    ListeningAttempt:
      type: object
      required: [id, materialId, mode, durationMs, score, segmentScores, replays, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        materialId: { type: string }
        mode: { $ref: '#/components/schemas/ListeningMode' }
        durationMs: { type: integer }
        score: { $ref: '#/components/schemas/NullableInt' }
        segmentScores: { type: array, items: { type: object, required: [index, accuracy], properties: { index: { type: integer }, accuracy: { type: integer } } } }
        replays: { type: integer }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    ListeningAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ListeningAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateListeningAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [materialId, mode, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            materialId: { type: string }
            mode: { $ref: '#/components/schemas/ListeningMode' }
            durationMs: { type: integer, minimum: 0, maximum: 7200000 }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            dictationAnswers: { type: array, items: { type: object, required: [index, answer], properties: { index: { type: integer }, answer: { type: string, maxLength: 1000 } } } }
            replays: { type: integer, minimum: 0 }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── writing ──
    WritingCorrection:
      type: object
      required: [score, corrections, feedback, revisedText]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        corrections: { type: array, items: { $ref: '#/components/schemas/Correction' } }
        feedback: { type: string }
        revisedText: { type: string }
    WritingEntry:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [kind, title, prompt, content, status, charCount, correction, submittedAt]
          properties:
            kind: { $ref: '#/components/schemas/WritingKind' }
            title: { type: string }
            prompt: { $ref: '#/components/schemas/NullableString' }
            content: { type: string }
            status: { $ref: '#/components/schemas/WritingStatus' }
            charCount: { type: integer }
            correction: { oneOf: [{ $ref: '#/components/schemas/WritingCorrection' }, { type: 'null' }] }
            submittedAt: { type: [string, 'null'], format: date-time }
    WritingEntryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WritingEntry' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    SubmitWritingRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [kind, title, content]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            kind: { $ref: '#/components/schemas/WritingKind' }
            title: { type: string, minLength: 1, maxLength: 120 }
            prompt: { type: [string, 'null'], maxLength: 500 }
            content: { type: string, minLength: 1, maxLength: 4000 }

    # ── reading ──
    ReadingMaterialSummary:
      type: object
      required: [id, title, level, topic, charCount]
      properties:
        id: { type: string }
        title: { type: string }
        level: { $ref: '#/components/schemas/DifficultyLevel' }
        topic: { type: string }
        charCount: { type: integer }
    ReadingMaterial:
      allOf:
        - { $ref: '#/components/schemas/ReadingMaterialSummary' }
        - type: object
          required: [body, glossary, questions]
          properties:
            body: { type: string }
            glossary: { type: array, items: { $ref: '#/components/schemas/CommonWord' } }
            questions: { type: array, items: { $ref: '#/components/schemas/QuizQuestion' } }
    ReadingMaterialPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReadingMaterialSummary' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    ReadingAttempt:
      type: object
      required: [id, materialId, durationMs, charCount, charsPerMinute, lookedUpWords, comprehensionCorrect, comprehensionTotal, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        materialId: { type: string }
        durationMs: { type: integer }
        charCount: { type: integer }
        charsPerMinute: { type: number }
        lookedUpWords: { type: array, items: { type: string } }
        comprehensionCorrect: { $ref: '#/components/schemas/NullableInt' }
        comprehensionTotal: { $ref: '#/components/schemas/NullableInt' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    ReadingAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReadingAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateReadingAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [materialId, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            materialId: { type: string }
            durationMs: { type: integer, minimum: 1000, maximum: 7200000 }
            lookedUpWords: { type: array, items: { type: string, maxLength: 60 }, maxItems: 200 }
            answers: { type: array, items: { type: object, required: [questionId, choiceIndex], properties: { questionId: { type: string }, choiceIndex: { type: integer, minimum: 0, maximum: 3 } } } }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── pronunciation ──
    PairSide:
      type: object
      required: [text, reading, meaningZh]
      properties: { text: { type: string }, reading: { type: string }, meaningZh: { type: string } }
    PronunciationPair:
      type: object
      required: [id, category, a, b, tip]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/PronunciationCategory' }
        a: { $ref: '#/components/schemas/PairSide' }
        b: { $ref: '#/components/schemas/PairSide' }
        tip: { type: string }
    PronunciationPairPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PronunciationPair' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    PronunciationAttempt:
      type: object
      required: [id, pairId, mode, target, chosen, transcript, method, correct, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        pairId: { type: string }
        mode: { $ref: '#/components/schemas/PronunciationMode' }
        target: { type: string, enum: [a, b] }
        chosen: { type: [string, 'null'], enum: [a, b, null] }
        transcript: { $ref: '#/components/schemas/NullableString' }
        method: { oneOf: [{ $ref: '#/components/schemas/RecognitionMethod' }, { type: 'null' }] }
        correct: { type: boolean }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    PronunciationAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PronunciationAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreatePronunciationAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [pairId, mode, target]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            pairId: { type: string }
            mode: { $ref: '#/components/schemas/PronunciationMode' }
            target: { type: string, enum: [a, b] }
            chosen: { type: string, enum: [a, b] }
            transcript: { type: string, maxLength: 200 }
            method: { $ref: '#/components/schemas/RecognitionMethod' }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── expressions ──
    ExpressionItem:
      type: object
      required: [id, type, kind, expression, reading, plainForm, meaningZh, usageNote, examples, level]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ExpressionType' }
        kind: { type: string, enum: [sonkeigo, kenjougo, teineigo, kanyouku, yojijukugo, kotowaza, onomatopoeia] }
        expression: { type: string }
        reading: { type: string }
        plainForm: { $ref: '#/components/schemas/NullableString' }
        meaningZh: { type: string }
        usageNote: { type: string }
        examples: { type: array, items: { $ref: '#/components/schemas/Example' } }
        level: { $ref: '#/components/schemas/DifficultyLevel' }
    ExpressionItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExpressionItem' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    ExpressionAttempt:
      type: object
      required: [id, itemId, mode, answer, correct, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        itemId: { type: string }
        mode: { $ref: '#/components/schemas/ExpressionDrillMode' }
        answer: { type: string }
        correct: { type: boolean }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    ExpressionAttemptPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExpressionAttempt' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateExpressionAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [itemId, mode, answer, correct]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            itemId: { type: string }
            mode: { $ref: '#/components/schemas/ExpressionDrillMode' }
            answer: { type: string, maxLength: 300 }
            correct: { type: boolean }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── kanji ──
    Kanji:
      type: object
      required: [id, character, onyomi, kunyomi, meaningsZh, strokeCount, radical, jlptLevel, commonWords, progress]
      properties:
        id: { type: string }
        character: { type: string }
        onyomi: { type: array, items: { type: string } }
        kunyomi: { type: array, items: { type: string } }
        meaningsZh: { type: array, items: { type: string } }
        strokeCount: { type: integer }
        radical: { type: string }
        jlptLevel: { $ref: '#/components/schemas/JlptLevel' }
        commonWords: { type: array, items: { $ref: '#/components/schemas/CommonWord' } }
        progress:
          type: object
          required: [attempts, correctRate, lastAttemptAt]
          properties:
            attempts: { type: integer }
            correctRate: { type: [number, 'null'] }
            lastAttemptAt: { type: [string, 'null'], format: date-time }
    KanjiPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Kanji' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    KanjiAttempt:
      type: object
      required: [id, kanjiId, mode, answer, correct, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kanjiId: { type: string }
        mode: { $ref: '#/components/schemas/KanjiDrillMode' }
        answer: { type: string }
        correct: { type: boolean }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    CreateKanjiAttemptRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [kanjiId, mode, answer, correct]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            kanjiId: { type: string }
            mode: { $ref: '#/components/schemas/KanjiDrillMode' }
            answer: { type: string, maxLength: 100 }
            correct: { type: boolean }
            attemptedAt: { $ref: '#/components/schemas/IsoDateTime' }

    # ── vocab test ──
    VocabTestItem:
      type: object
      required: [itemId, kind, word, options]
      properties:
        itemId: { type: string }
        kind: { $ref: '#/components/schemas/VocabTestItemKind' }
        word: { type: string }
        options: { type: [array, 'null'], items: { type: string } }
    VocabTestStartRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          properties: { startLevel: { $ref: '#/components/schemas/JlptLevel' } }
    VocabTestStartResult:
      type: object
      required: [testId, expiresAt, items]
      properties:
        testId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        items: { type: array, items: { $ref: '#/components/schemas/VocabTestItem' } }
    VocabTestSubmitRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [testId, answers, durationMs]
          properties:
            testId: { $ref: '#/components/schemas/Uuid' }
            answers:
              type: array
              items: { type: object, required: [itemId], properties: { itemId: { type: string }, known: { type: boolean }, choiceIndex: { type: integer, minimum: 0, maximum: 3 } } }
            durationMs: { type: integer, minimum: 0 }
    VocabTestResult:
      type: object
      required: [id, testId, estimatedVocab, jlptEstimate, falseAlarmRate, bands, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testId: { $ref: '#/components/schemas/Uuid' }
        estimatedVocab: { type: integer }
        jlptEstimate: { $ref: '#/components/schemas/JlptLevel' }
        falseAlarmRate: { type: number }
        bands: { type: array, items: { type: object, required: [upTo, knownRate], properties: { upTo: { type: integer }, knownRate: { type: number } } } }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    VocabTestResultPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VocabTestResult' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }

    # ── courses ──
    Course:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [title, platform, url, totalEpisodes, currentEpisode, status, note, lastStudiedAt]
          properties:
            title: { type: string }
            platform: { $ref: '#/components/schemas/CoursePlatform' }
            url: { type: string, format: uri }
            totalEpisodes: { $ref: '#/components/schemas/NullableInt' }
            currentEpisode: { type: integer, minimum: 0 }
            status: { $ref: '#/components/schemas/CourseStatus' }
            note: { $ref: '#/components/schemas/NullableString' }
            lastStudiedAt: { type: [string, 'null'], format: date-time }
    CoursePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Course' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateCourseRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [title, platform, url]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            title: { type: string, minLength: 1, maxLength: 120 }
            platform: { $ref: '#/components/schemas/CoursePlatform' }
            url: { type: string, format: uri, maxLength: 500 }
            totalEpisodes: { type: [integer, 'null'], minimum: 1 }
            currentEpisode: { type: integer, minimum: 0 }
            status: { $ref: '#/components/schemas/CourseStatus' }
            note: { type: [string, 'null'], maxLength: 1000 }
    PatchCourseRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedWrite' }
        - type: object
          minProperties: 2
          properties:
            title: { type: string, minLength: 1, maxLength: 120 }
            platform: { $ref: '#/components/schemas/CoursePlatform' }
            url: { type: string, format: uri, maxLength: 500 }
            totalEpisodes: { type: [integer, 'null'], minimum: 1 }
            currentEpisode: { type: integer, minimum: 0 }
            status: { $ref: '#/components/schemas/CourseStatus' }
            note: { type: [string, 'null'], maxLength: 1000 }
            lastStudiedAt: { type: [string, 'null'], format: date-time }

    # ── stats ──
    TimeLog:
      type: object
      required: [id, module, startedAt, durationMs, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        module: { $ref: '#/components/schemas/StudyModule' }
        startedAt: { $ref: '#/components/schemas/IsoDateTime' }
        durationMs: { type: integer }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    CreateTimeLogRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [module, startedAt, durationMs]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            module: { $ref: '#/components/schemas/StudyModule' }
            startedAt: { $ref: '#/components/schemas/IsoDateTime' }
            durationMs: { type: integer, minimum: 1000, maximum: 14400000 }
    MockSection:
      type: object
      required: [name, score, max]
      properties: { name: { type: string }, score: { type: integer, minimum: 0 }, max: { type: integer, minimum: 1 } }
    JlptMock:
      allOf:
        - { $ref: '#/components/schemas/BaseEntity' }
        - type: object
          required: [level, takenAt, sections, total, totalMax, source]
          properties:
            level: { $ref: '#/components/schemas/JlptLevel' }
            takenAt: { $ref: '#/components/schemas/IsoDate' }
            sections: { type: array, items: { $ref: '#/components/schemas/MockSection' } }
            total: { type: integer }
            totalMax: { type: integer }
            source: { $ref: '#/components/schemas/NullableString' }
    JlptMockPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JlptMock' } }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
    CreateJlptMockRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [level, takenAt, sections]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            level: { $ref: '#/components/schemas/JlptLevel' }
            takenAt: { $ref: '#/components/schemas/IsoDate' }
            sections: { type: array, items: { $ref: '#/components/schemas/MockSection' }, minItems: 1, maxItems: 5 }
            source: { type: [string, 'null'], maxLength: 120 }
    TrendPoint:
      type: object
      required: [date, value]
      properties: { date: { $ref: '#/components/schemas/IsoDate' }, value: { type: number } }
    StatsResponse:
      type: object
      required: [range, streak, totals, moduleMinutes, daily, mistakes, trends, scenarioMastery]
      properties:
        range:
          type: object
          required: [from, to, timezone]
          properties: { from: { $ref: '#/components/schemas/IsoDate' }, to: { $ref: '#/components/schemas/IsoDate' }, timezone: { type: string } }
        streak:
          type: object
          required: [current, longest, studiedToday]
          properties: { current: { type: integer }, longest: { type: integer }, studiedToday: { type: boolean } }
        totals:
          type: object
          required: [minutes, cardsReviewed, cardsLearned, tasksDone, conversations, writingEntries]
          properties:
            minutes: { type: integer }
            cardsReviewed: { type: integer }
            cardsLearned: { type: integer }
            tasksDone: { type: integer }
            conversations: { type: integer }
            writingEntries: { type: integer }
        moduleMinutes:
          type: array
          items: { type: object, required: [module, minutes], properties: { module: { $ref: '#/components/schemas/StudyModule' }, minutes: { type: integer } } }
        daily:
          type: array
          items:
            type: object
            required: [date, minutes, cardsReviewed, tasksDone]
            properties: { date: { $ref: '#/components/schemas/IsoDate' }, minutes: { type: integer }, cardsReviewed: { type: integer }, tasksDone: { type: integer } }
        mistakes:
          type: object
          required: [total, mastered, open, quizAnswered, quizWrong, errorRate]
          properties:
            total: { type: integer }
            mastered: { type: integer }
            open: { type: integer }
            quizAnswered: { type: integer }
            quizWrong: { type: integer }
            errorRate: { type: number, description: quizWrong / quizAnswered，0–1 }
        trends:
          type: object
          required: [speakingOverall, writingScore, vocabEstimate, jlptMock]
          properties:
            speakingOverall: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
            writingScore: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
            vocabEstimate: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
            jlptMock:
              type: array
              items:
                allOf:
                  - { $ref: '#/components/schemas/TrendPoint' }
                  - { type: object, required: [level], properties: { level: { $ref: '#/components/schemas/JlptLevel' } } }
        scenarioMastery:
          type: array
          items:
            type: object
            required: [category, total, attempted, mastered, avgScore]
            properties:
              category: { $ref: '#/components/schemas/ScenarioCategory' }
              total: { type: integer }
              attempted: { type: integer }
              mastered: { type: integer }
              avgScore: { type: [number, 'null'] }

    # ── data ──
    ExportBundle:
      type: object
      required: [formatVersion, exportedAt, user, entities]
      properties:
        formatVersion: { type: integer, const: 1 }
        exportedAt: { $ref: '#/components/schemas/IsoDateTime' }
        user: { $ref: '#/components/schemas/User' }
        entities:
          type: object
          description: key 为 SyncEntity，value 为该实体全部记录（含软删除）
          additionalProperties: { type: array, items: { type: object } }
    ImportDataRequest:
      allOf:
        - { $ref: '#/components/schemas/WriteMeta' }
        - type: object
          required: [mode, bundle]
          properties:
            mode: { $ref: '#/components/schemas/ImportMode' }
            bundle: { $ref: '#/components/schemas/ExportBundle' }
    ImportDataResult:
      type: object
      required: [mode, counts]
      properties:
        mode: { $ref: '#/components/schemas/ImportMode' }
        counts:
          type: object
          additionalProperties:
            type: object
            required: [created, updated, skipped]
            properties: { created: { type: integer }, updated: { type: integer }, skipped: { type: integer } }
    BackupStatus:
      type: object
      required: [lastBackupAt, lastBackupSizeBytes, lastVerifiedAt, lastVerifyOk, retainedCount]
      properties:
        lastBackupAt: { type: [string, 'null'], format: date-time }
        lastBackupSizeBytes: { $ref: '#/components/schemas/NullableInt' }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        lastVerifyOk: { type: [boolean, 'null'] }
        retainedCount: { type: integer }

    # ── sync ──
    SyncOp:
      type: object
      required: [clientOpId, entity, action, id, clientTimestamp]
      properties:
        clientOpId: { $ref: '#/components/schemas/Uuid' }
        entity: { $ref: '#/components/schemas/PushableEntity' }
        action: { $ref: '#/components/schemas/SyncOpAction' }
        id: { $ref: '#/components/schemas/Uuid' }
        baseVersion: { type: integer, minimum: 1, description: update/delete 必填 }
        data: { type: object, description: 与对应 REST 请求体同构（去掉 clientOpId/baseVersion） }
        clientTimestamp: { $ref: '#/components/schemas/IsoDateTime' }
    SyncPushRequest:
      type: object
      required: [deviceId, ops]
      properties:
        deviceId: { type: string, maxLength: 64 }
        ops: { type: array, items: { $ref: '#/components/schemas/SyncOp' }, minItems: 1, maxItems: 200 }
      example:
        deviceId: android-chrome-7f3a
