      operationId: createSpeakingAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSpeakingAttemptRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingAttempt' } } } }

